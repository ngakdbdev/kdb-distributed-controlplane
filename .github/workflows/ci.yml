name: CI

# Runs the existing test suite (545 backend tests, verified passing this
# session) on every push/PR - previously nothing ran it automatically at
# all; every verification this session was a manual `pytest` invocation.
# Three independent jobs so one kind of failure (e.g. a frontend build
# break) doesn't hide an unrelated one (a backend test regression).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: control-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: control-api
        # conftest.py points DATABASE_URL at a fresh temp SQLite file and
        # runs the real Alembic migration chain against it before any test
        # imports app.main - the same schema-setup path production uses
        # (Dockerfile's `alembic upgrade head` before serving), not a
        # shortcut, so this job also catches migration-chain regressions.
        run: python -m pytest -q tests

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        working-directory: web-ui
        run: npm ci
      - name: Build
        working-directory: web-ui
        # No frontend test suite exists yet - a clean production build is
        # the cheapest available check and catches real breakage (a bad
        # import, a JSX syntax error) before it reaches a deploy.
        run: npm run build

  q-lint:
    name: q syntax check (bare-slash block-comment trap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a lone "/" line
        # A q source line that is EXACTLY "/" opens a multi-line block
        # comment that silently swallows everything after it to end of
        # file (closed only by a line that's exactly "\"). Confirmed live
        # this session, twice, independently: it disabled all of wdb.q's
        # EOD catch-up logic in one file, and ALL of hdb.q below line 8 in
        # another (hdb ran as an empty shell - zero tables, zero reload
        # logic - for as long as that bug was in place). Cheap to catch
        # here permanently rather than re-discovering it live again.
        run: |
          hits=$(grep -rn '^/$' --include='*.q' data-plane/ 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Found a lone '/' line - this opens a q block comment that swallows the rest of the file:"
            echo "$hits"
            exit 1
          fi
          echo "No bare-slash block-comment traps found."
