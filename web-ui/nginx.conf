server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, short TTL - nginx's proxy_pass otherwise
    # resolves a bare hostname ONCE at config load and caches that IP for
    # the life of the worker process. Confirmed live: redeploying control-api
    # (a new container, a new IP) left this nginx still dialing the OLD,
    # now-dead IP for every single /api/ request - a 502 on everything,
    # fixed only by restarting web-ui too. Using a variable in proxy_pass
    # below (rather than a bare hostname) forces nginx through this resolver
    # on each request instead of caching, so a control-api redeploy alone is
    # enough going forward.
    resolver 127.0.0.11 valid=10s;

    # index.html references hashed asset filenames (index-<hash>.js/.css) that
    # change every build, so it must never be cached - otherwise a browser can
    # keep serving a stale index.html (and therefore a stale build) long after
    # a redeploy, with no visible error, just "why am I still seeing the old
    # UI." The hashed assets below are the opposite: safe to cache forever,
    # since any content change gives them a new filename.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # nginx only auto-strips the location prefix (/api/ -> /) when
        # proxy_pass's target is a static string; the moment it's a
        # variable (needed above for per-request DNS re-resolution), that
        # stripping stops happening and the FULL original URI - /api/...,
        # prefix included - gets forwarded as-is. control-api has no /api
        # prefix on its own routes, so every request 404'd there (confirmed
        # live). rewrite ... break strips it explicitly before proxy_pass.
        set $control_api "control-api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$control_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/metrics/stream {
        set $control_api "control-api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$control_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
