# GENERATED by scripts/gen_topology.py - do not edit by hand.
# Regenerate for a different shard count with:
#   python scripts/gen_topology.py --shards <N> --compose docker-compose.yml --shards-json data-plane/shards.json
name: kdb-control-plane

x-kdb-build: &kdb-build
  context: ./data-plane
  dockerfile: docker/Dockerfile.kdb

x-feed-build: &feed-build
  context: ./data-plane
  dockerfile: docker/Dockerfile.feed

x-kdb-env: &kdb-env
  KX_INSTALL_SOURCE: "${KX_INSTALL_SOURCE:-local}"
  KX_BEARER_TOKEN: "${KX_BEARER_TOKEN:-}"
  KX_VERSION: "${KX_VERSION:-4.1}"
  KX_CHANNEL: "${KX_CHANNEL:-~latest~}"
  KX_LICENSE_PATH: "${KX_LICENSE_PATH:-/kdbx/k4.lic}"

services:
  # ---------------------------------------------------------------- shard s0 (A-M)
  tp-s0:
    build: *kdb-build
    command: ["tick.q", "s0", "-p", "5010"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache
      - tp-log-s0:/app/log

  wdb-s0:
    build: *kdb-build
    command: ["wdb.q", "-shard", "s0", "-tphost", "tp-s0", "-tpport", "5010",
              "-flushmin", "2", "-dbdir", "/data/db", "-p", "5040"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    depends_on: [tp-s0]
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache
      - db-s0:/data/db

  rdb-s0:
    build: *kdb-build
    command: ["rdb.q", "-shard", "s0", "-tphost", "tp-s0", "-tpport", "5010", "-p", "5020"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    depends_on: [tp-s0]
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache

  idb-s0:
    build: *kdb-build
    command: ["idb.q", "-shard", "s0", "-dbdir", "/data/db", "-pollsec", "15", "-p", "5030"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    depends_on: [wdb-s0]
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache
      - db-s0:/data/db

  # ---------------------------------------------------------------- shard s1 (N-Z)
  tp-s1:
    build: *kdb-build
    command: ["tick.q", "s1", "-p", "5010"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache
      - tp-log-s1:/app/log

  wdb-s1:
    build: *kdb-build
    command: ["wdb.q", "-shard", "s1", "-tphost", "tp-s1", "-tpport", "5010",
              "-flushmin", "2", "-dbdir", "/data/db", "-p", "5040"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    depends_on: [tp-s1]
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache
      - db-s1:/data/db

  rdb-s1:
    build: *kdb-build
    command: ["rdb.q", "-shard", "s1", "-tphost", "tp-s1", "-tpport", "5010", "-p", "5020"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    depends_on: [tp-s1]
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache

  idb-s1:
    build: *kdb-build
    command: ["idb.q", "-shard", "s1", "-dbdir", "/data/db", "-pollsec", "15", "-p", "5030"]
    environment:
      <<: *kdb-env
    restart: unless-stopped
    depends_on: [wdb-s1]
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache
      - db-s1:/data/db

  # -------------------------------------------------------------------- gateway
  # Learns its shard count entirely from the mounted shards.json - never
  # hardcoded. Regenerate shards.json with scripts/gen_topology.py to rescale.
  gateway:
    build: *kdb-build
    command: ["gateway.q", "-p", "5050"]
    environment:
      <<: *kdb-env
      SHARDS_JSON: /app/shards.json
    volumes:
      - ${KX_BINARIES_DIR:-./data-plane/docker/kdbx}:/kdbx:ro
      - kx-cache:/kdbx-cache
      - ./data-plane/shards.json:/app/shards.json:ro
    restart: unless-stopped
    depends_on: [rdb-s0, idb-s0, wdb-s0, rdb-s1, idb-s1, wdb-s1]

  # ---------------------------------------------------------------- feed sims
  # Fan out across all 2 tickerplants via SHARD_COUNT + TP_HOST_PATTERN.
  bpipe-sim:
    build: *feed-build
    command: ["bpipe_sim.py"]
    environment:
      SHARD_COUNT: "2"
      TP_HOST_PATTERN: "tp-{shard}"
      TP_PORT: "5010"
      BPIPE_RATE_HZ: "${BPIPE_RATE_HZ:-20}"
      SIM_SYMBOL_COUNT: "${SIM_SYMBOL_COUNT:-0}"   # grow the universe (e.g. 1000)
      BPIPE_SYMBOLS_FILE: "${BPIPE_SYMBOLS_FILE:-}"
    volumes:
      - ./data-plane/feeds/symbols:/symbols:ro
    depends_on: [tp-s0, tp-s1]
    # on-failure (not always): recovers from a crash / a not-yet-ready TP, but a
    # clean stop from the Connectors screen stays stopped.
    restart: on-failure

  crims-sim:
    build: *feed-build
    command: ["crims_sim.py"]
    environment:
      SHARD_COUNT: "2"
      TP_HOST_PATTERN: "tp-{shard}"
      TP_PORT: "5010"
      CRIMS_RATE_HZ: "${CRIMS_RATE_HZ:-2}"
    depends_on: [tp-s0, tp-s1]
    restart: on-failure

  # Real market-data provider (opt-in). Streams live ticks into the same
  # tickerplants instead of the synthetic sims. Needs an API key supplied via
  # .env - never hardcode it here. Start with:
  #   docker compose --profile providers up -d finnhub-feed
  finnhub-feed:
    build: *feed-build
    profiles: ["providers"]
    command: ["-m", "providers.runner", "--provider", "finnhub", "--symbols", "${FINNHUB_SYMBOLS:-AAPL,MSFT,GOOGL,AMZN,TSLA}"]
    environment:
      SHARD_COUNT: "2"
      TP_HOST_PATTERN: "tp-{shard}"
      TP_PORT: "5010"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      PROVIDER_SYMBOLS_FILE: "${PROVIDER_SYMBOLS_FILE:-}"
    volumes:
      - ./data-plane/feeds/symbols:/symbols:ro
    depends_on: [tp-s0, tp-s1]
    restart: on-failure

  # Twelve Data live provider (opt-in). Key from .env only - never hardcode.
  #   docker compose --profile providers up -d twelvedata-feed
  twelvedata-feed:
    build: *feed-build
    profiles: ["providers"]
    command: ["-m", "providers.runner", "--provider", "twelvedata", "--symbols", "${TWELVEDATA_SYMBOLS:-AAPL,MSFT,GOOGL,AMZN,TSLA}"]
    environment:
      SHARD_COUNT: "2"
      TP_HOST_PATTERN: "tp-{shard}"
      TP_PORT: "5010"
      TWELVEDATA_API_KEY: "${TWELVEDATA_API_KEY:-}"
      PROVIDER_SYMBOLS_FILE: "${PROVIDER_SYMBOLS_FILE:-}"
    volumes:
      - ./data-plane/feeds/symbols:/symbols:ro
    depends_on: [tp-s0, tp-s1]
    restart: on-failure

  # ------------------------------------------------------------------ control
  # Optional local Postgres for testing the real-database path (see
  # control-api/README-database.md). Opt in with:
  #   docker compose --profile postgres up -d postgres
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kdb_control_plane
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  control-api:
    build: ./control-api
    restart: unless-stopped
    environment:
      SHARD_COUNT: "2"
      PLATFORM_ADMIN_EMAIL: "${PLATFORM_ADMIN_EMAIL:-admin@platform.local}"
      PLATFORM_ADMIN_PASSWORD_HASH: "${PLATFORM_ADMIN_PASSWORD_HASH:-}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-deploy}"
      WATCHDOG_SHARED_SECRET: "${WATCHDOG_SHARED_SECRET:-dev-watchdog-secret-change-in-deploy}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:///./data/control_plane.db}"
      COMPOSE_PROJECT_NAME: "kdb-control-plane"
      GATEWAY_HOST: gateway
      GATEWAY_PORT: "5050"
    volumes:
      - control-api-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on: [gateway]

  watchdog:
    build: ./watchdog
    restart: unless-stopped
    environment:
      SHARD_COUNT: "2"
      COMPOSE_PROJECT_NAME: "kdb-control-plane"
      CONTROL_API_URL: "http://control-api:8000"
      WATCHDOG_SHARED_SECRET: "${WATCHDOG_SHARED_SECRET:-dev-watchdog-secret-change-in-deploy}"
      WATCHDOG_POLL_SEC: "5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [control-api]

  web-ui:
    build: ./web-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [control-api]

volumes:
  tp-log-s0:
  db-s0:
  tp-log-s1:
  db-s1:
  control-api-data:
  postgres-data:
  kx-cache:
