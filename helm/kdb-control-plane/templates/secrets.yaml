{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: kdb-control-plane-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  ADMIN_USER: {{ .Values.secrets.adminUser | quote }}
  ADMIN_PASSWORD_HASH: {{ .Values.secrets.adminPasswordHash | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  WATCHDOG_SHARED_SECRET: {{ .Values.secrets.watchdogSharedSecret | quote }}
  NL2Q_LLM_API_KEY: {{ .Values.secrets.nl2qLlmApiKey | quote }}
  LICENSE_KEY: {{ .Values.secrets.licenseKey | default "" | quote }}
  # Only needed if you use the credentials-only cloud auto-provisioning
  # endpoints (POST /cloud-provision/{aws,azure,gcp}) - see
  # control-api/app/cloud_provisioner.py. No insecure default, same
  # reasoning as .env.example's own comment on this value.
  CLOUD_CREDENTIALS_ENCRYPTION_KEY: {{ .Values.secrets.cloudCredentialsEncryptionKey | default "" | quote }}
  # Reused by cloud_provisioner.py to seed the kdbx-license Secret on a
  # newly-terraform-created cluster - the same values as the kdbx-license
  # Secret's own KX_BEARER_TOKEN/KDB_LICENSE_B64 (see values.yaml's kdbx
  # comment), duplicated here only because control-api and the kdb+ pods
  # read from two different Secrets.
  KX_BEARER_TOKEN: {{ .Values.secrets.kxBearerToken | default "" | quote }}
  KDB_LICENSE_B64: {{ .Values.secrets.kdbLicenseB64 | default "" | quote }}
{{- end }}
