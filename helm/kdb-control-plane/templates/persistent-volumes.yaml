{{/*
One db PVC and one tp-log PVC per shard, generated from the shard count.
db-s{i} is shared between shard i's wdb (writer) and idb (reader).
*/}}
{{- range $i := until (int .Values.shardCount) }}
{{- $sid := printf "s%d" $i }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-{{ $sid }}
  namespace: {{ $.Values.global.namespace }}
  labels: { app: db-{{ $sid }}, shard: {{ $sid | quote }} }
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $.Values.global.storageClassName }}
  storageClassName: {{ $.Values.global.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.dataPlane.dbVolumeSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tp-log-{{ $sid }}
  namespace: {{ $.Values.global.namespace }}
  labels: { app: tp-log-{{ $sid }}, shard: {{ $sid | quote }} }
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if $.Values.global.storageClassName }}
  storageClassName: {{ $.Values.global.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $.Values.dataPlane.tpLogVolumeSize }}
{{- end }}
