{{/*
  Guard: SQLite cannot back more than one control-api replica (no
  concurrent-writer safety), so autoscaling the API on a sqlite URL is a
  foot-gun. Fail the install early with an actionable message rather than
  letting a scaled deployment corrupt its own database.
*/}}
{{- if and .Values.controlApi.autoscaling.enabled (hasPrefix "sqlite" .Values.database.url) }}
{{- fail "controlApi.autoscaling.enabled=true requires a non-sqlite database.url (sqlite has no cross-replica writer safety). Point database.url at postgres/mysql/mssql - see control-api/README-database.md." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: {{ .Values.global.namespace }}
  labels: { app: control-api }
spec:
  {{- if not .Values.controlApi.autoscaling.enabled }}
  replicas: {{ .Values.controlApi.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: control-api }
  template:
    metadata:
      labels: { app: control-api }
    spec:
      serviceAccountName: control-api
      containers:
        - name: control-api
          image: "{{ .Values.global.imageRegistry }}{{ .Values.controlApi.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.controlApi.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default "kdb-control-plane-secrets" }}
          env:
            - name: ORCHESTRATOR_BACKEND
              value: kubernetes
            - name: KUBE_NAMESPACE
              value: {{ .Values.global.namespace }}
            - name: SHARD_COUNT
              value: {{ .Values.shardCount | quote }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            - name: GATEWAY_HOST
              value: gateway
            - name: GATEWAY_PORT
              value: "5050"
            - name: NL2Q_LLM_PROVIDER
              value: {{ .Values.nl2q.llmProvider | quote }}
            - name: NL2Q_LLM_MODEL
              value: {{ .Values.nl2q.llmModel | quote }}
            - name: NL2Q_LLM_BASE_URL
              value: {{ .Values.nl2q.llmBaseUrl | quote }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.controlApi.port }} }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.controlApi.port }} }
            initialDelaySeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: control-api-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: control-api-data
  namespace: {{ .Values.global.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.global.storageClassName }}
  storageClassName: {{ .Values.global.storageClassName }}
  {{- end }}
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: control-api
  namespace: {{ .Values.global.namespace }}
spec:
  selector: { app: control-api }
  ports:
    - port: {{ .Values.controlApi.port }}
      targetPort: {{ .Values.controlApi.port }}
{{- if .Values.controlApi.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-api
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: control-api
  minReplicas: {{ .Values.controlApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.controlApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.controlApi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
