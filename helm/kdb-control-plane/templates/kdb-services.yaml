{{/*
Per-shard q processes, generated by looping over the shard count. For each
shard s{i} this renders five Deployments+Services (tickerplant/wdb/rdb/idb/hdb)
on uniform per-tier ports, then the single gateway. Nothing here is
hand-duplicated per shard - change .Values.shardCount and the data plane
scales. Shard ids are stable indices (s0..s{N-1}); the letter range each owns
lives in the gateway's shards.json ConfigMap.
*/}}
{{- $ns := .Values.global.namespace -}}
{{- $reg := .Values.global.imageRegistry -}}
{{- $tag := .Values.global.imageTag -}}
{{- $pull := .Values.global.imagePullPolicy -}}
{{- $lic := .Values.kdbx.licenseSecretName -}}
{{- $res := .Values.dataPlane.resources -}}
{{- $flush := .Values.dataPlane.flushMinutes -}}
{{- $poll := .Values.dataPlane.idbPollSeconds -}}
{{- $eodHour := .Values.eod.hourUtc -}}
{{- $retention := .Values.idb.retentionDays -}}
{{- $rdbRetention := .Values.rdb.retentionMin -}}
{{- $hdbRetention := .Values.hdb.retentionDays -}}

{{- range $i := until (int .Values.shardCount) }}
{{- $sid := printf "s%d" $i }}
{{/* ---- tickerplant ---- */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp-{{ $sid }}
  namespace: {{ $ns }}
  labels: { app: tp-{{ $sid }}, role: tickerplant, shard: {{ $sid | quote }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: tp-{{ $sid }} } }
  template:
    metadata:
      labels: { app: tp-{{ $sid }}, role: tickerplant, shard: {{ $sid | quote }} }
    spec:
      containers:
        - name: tp-{{ $sid }}
          image: "{{ $reg }}kdb-control-plane/data-plane:{{ $tag }}"
          imagePullPolicy: {{ $pull }}
          command: ["q", "tick.q", "{{ $sid }}", "-p", "5010", "-eodhour", "{{ $eodHour }}"]
          ports: [{ containerPort: 5010 }]
          volumeMounts:
            - { name: tp-log, mountPath: /app/log }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/q, subPath: q }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/k4.lic, subPath: k4.lic }
          resources: {{ $res | toYaml | nindent 12 }}
      volumes:
        - name: tp-log
          persistentVolumeClaim: { claimName: tp-log-{{ $sid }} }
        - name: kdbx-license
          secret: { secretName: {{ $lic }}, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata: { name: tp-{{ $sid }}, namespace: {{ $ns }} }
spec:
  selector: { app: tp-{{ $sid }} }
  ports: [{ port: 5010, targetPort: 5010 }]
{{/* ---- wdb (owns the shard's db PVC) ---- */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdb-{{ $sid }}
  namespace: {{ $ns }}
  labels: { app: wdb-{{ $sid }}, role: wdb, shard: {{ $sid | quote }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: wdb-{{ $sid }} } }
  template:
    metadata:
      labels: { app: wdb-{{ $sid }}, role: wdb, shard: {{ $sid | quote }} }
    spec:
      containers:
        - name: wdb-{{ $sid }}
          image: "{{ $reg }}kdb-control-plane/data-plane:{{ $tag }}"
          imagePullPolicy: {{ $pull }}
          command: ["q", "wdb.q", "-shard", "{{ $sid }}", "-tphost", "tp-{{ $sid }}",
                    "-tpport", "5010", "-flushmin", "{{ $flush }}", "-retentionmin", "{{ $rdbRetention }}",
                    "-dbdir", "/data/db",
                    "-hdbdir", "/data/hdb", "-idbhost", "idb-{{ $sid }}", "-idbport", "5030",
                    "-hdbhost", "hdb-{{ $sid }}", "-hdbport", "5060", "-p", "5040"]
          ports: [{ containerPort: 5040 }]
          volumeMounts:
            - { name: db, mountPath: /data/db }
            - { name: hdb, mountPath: /data/hdb }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/q, subPath: q }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/k4.lic, subPath: k4.lic }
          resources: {{ $res | toYaml | nindent 12 }}
      volumes:
        - name: db
          persistentVolumeClaim: { claimName: db-{{ $sid }} }
        - name: hdb
          persistentVolumeClaim: { claimName: hdb-{{ $sid }} }
        - name: kdbx-license
          secret: { secretName: {{ $lic }}, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata: { name: wdb-{{ $sid }}, namespace: {{ $ns }} }
spec:
  selector: { app: wdb-{{ $sid }} }
  ports: [{ port: 5040, targetPort: 5040 }]
{{/* ---- rdb (in-memory, no PVC) ---- */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdb-{{ $sid }}
  namespace: {{ $ns }}
  labels: { app: rdb-{{ $sid }}, role: rdb, shard: {{ $sid | quote }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: rdb-{{ $sid }} } }
  template:
    metadata:
      labels: { app: rdb-{{ $sid }}, role: rdb, shard: {{ $sid | quote }} }
    spec:
      containers:
        - name: rdb-{{ $sid }}
          image: "{{ $reg }}kdb-control-plane/data-plane:{{ $tag }}"
          imagePullPolicy: {{ $pull }}
          command: ["q", "rdb.q", "-shard", "{{ $sid }}", "-tphost", "tp-{{ $sid }}",
                    "-tpport", "5010", "-p", "5020"]
          ports: [{ containerPort: 5020 }]
          volumeMounts:
            - { name: kdbx-license, mountPath: /usr/local/kdbx/q, subPath: q }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/k4.lic, subPath: k4.lic }
          resources: {{ $res | toYaml | nindent 12 }}
      volumes:
        - name: kdbx-license
          secret: { secretName: {{ $lic }}, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata: { name: rdb-{{ $sid }}, namespace: {{ $ns }} }
spec:
  selector: { app: rdb-{{ $sid }} }
  ports: [{ port: 5020, targetPort: 5020 }]
{{/* ---- idb (shares the shard's db PVC with its wdb; must co-locate) ---- */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idb-{{ $sid }}
  namespace: {{ $ns }}
  labels: { app: idb-{{ $sid }}, role: idb, shard: {{ $sid | quote }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: idb-{{ $sid }} } }
  template:
    metadata:
      labels: { app: idb-{{ $sid }}, role: idb, shard: {{ $sid | quote }} }
    spec:
      # idb shares a ReadWriteOnce PVC with its shard's wdb, and block storage
      # on every major cloud (EBS/Azure Disk/PD) is single-node-attach only, so
      # idb must schedule onto the same node as its wdb. A multi-node setup
      # would instead use an RWX filesystem (EFS/Azure Files/Filestore) and drop
      # this affinity.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: role, operator: In, values: ["wdb"] }
                  - { key: shard, operator: In, values: ["{{ $sid }}"] }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: idb-{{ $sid }}
          image: "{{ $reg }}kdb-control-plane/data-plane:{{ $tag }}"
          imagePullPolicy: {{ $pull }}
          command: ["q", "idb.q", "-shard", "{{ $sid }}", "-dbdir", "/data/db",
                    "-pollsec", "{{ $poll }}", "-retentiondays", "{{ $retention }}", "-p", "5030"]
          ports: [{ containerPort: 5030 }]
          volumeMounts:
            - { name: db, mountPath: /data/db }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/q, subPath: q }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/k4.lic, subPath: k4.lic }
          resources: {{ $res | toYaml | nindent 12 }}
      volumes:
        - name: db
          persistentVolumeClaim: { claimName: db-{{ $sid }} }
        - name: kdbx-license
          secret: { secretName: {{ $lic }}, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata: { name: idb-{{ $sid }}, namespace: {{ $ns }} }
spec:
  selector: { app: idb-{{ $sid }} }
  ports: [{ port: 5030, targetPort: 5030 }]
{{/* ---- hdb (shares the shard's hdb PVC with its wdb, which seals into it; must co-locate) ---- */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdb-{{ $sid }}
  namespace: {{ $ns }}
  labels: { app: hdb-{{ $sid }}, role: hdb, shard: {{ $sid | quote }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: hdb-{{ $sid }} } }
  template:
    metadata:
      labels: { app: hdb-{{ $sid }}, role: hdb, shard: {{ $sid | quote }} }
    spec:
      # same RWO co-location constraint as idb, but against the hdb PVC that
      # wdb seals end-of-day partitions into.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - { key: role, operator: In, values: ["wdb"] }
                  - { key: shard, operator: In, values: ["{{ $sid }}"] }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: hdb-{{ $sid }}
          image: "{{ $reg }}kdb-control-plane/data-plane:{{ $tag }}"
          imagePullPolicy: {{ $pull }}
          command: ["q", "hdb.q", "-shard", "{{ $sid }}", "-hdbdir", "/data/hdb",
                    "-reloadsec", "60", "-retentiondays", "{{ $hdbRetention }}", "-p", "5060"]
          ports: [{ containerPort: 5060 }]
          volumeMounts:
            - { name: hdb, mountPath: /data/hdb }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/q, subPath: q }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/k4.lic, subPath: k4.lic }
          resources: {{ $res | toYaml | nindent 12 }}
      volumes:
        - name: hdb
          persistentVolumeClaim: { claimName: hdb-{{ $sid }} }
        - name: kdbx-license
          secret: { secretName: {{ $lic }}, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata: { name: hdb-{{ $sid }}, namespace: {{ $ns }} }
spec:
  selector: { app: hdb-{{ $sid }} }
  ports: [{ port: 5060, targetPort: 5060 }]
{{- end }}
{{/* ============================ gateway (one, not per-shard) ============================ */}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.global.namespace }}
  labels: { app: gateway, role: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway, role: gateway }
      annotations:
        # roll the gateway when the topology changes so it rereads shards.json
        checksum/shards: {{ include "kdb-control-plane.shardsJson" . | sha256sum }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}kdb-control-plane/data-plane:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["q", "gateway.q", "-p", "5050"]
          env:
            - { name: SHARDS_JSON, value: /app/shards.json }
          ports: [{ containerPort: 5050 }]
          volumeMounts:
            - { name: shards, mountPath: /app/shards.json, subPath: shards.json }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/q, subPath: q }
            - { name: kdbx-license, mountPath: /usr/local/kdbx/k4.lic, subPath: k4.lic }
          resources: {{ .Values.dataPlane.resources | toYaml | nindent 12 }}
      volumes:
        - name: shards
          configMap: { name: gateway-shards }
        - name: kdbx-license
          secret: { secretName: {{ .Values.kdbx.licenseSecretName }}, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: {{ .Values.global.namespace }} }
spec:
  selector: { app: gateway }
  ports: [{ port: 5050, targetPort: 5050 }]
