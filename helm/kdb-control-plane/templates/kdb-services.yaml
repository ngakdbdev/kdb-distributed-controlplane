{{- range $svc := .Values.kdbServices }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace }}
  labels: { app: {{ $svc.name }}, role: {{ $svc.role }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $svc.name }} }
  template:
    metadata:
      labels: { app: {{ $svc.name }}, role: {{ $svc.role }} }
      {{- if $svc.shard }}
      annotations: { kdb-control-plane/shard: {{ $svc.shard | quote }} }
      {{- end }}
    spec:
      {{- if and $svc.volumes.db (ne $svc.role "wdb") }}
      # idb must land on the same node as its shard's wdb, since they share
      # a ReadWriteOnce PVC - block storage on every major cloud (EBS/Azure
      # Disk/PD) is single-node-attach only. A production multi-node setup
      # would instead use an RWX filesystem (EFS/Azure Files/Filestore/NFS)
      # and drop this affinity requirement.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: kdb-control-plane/shard
                    operator: In
                    values: [{{ $svc.shard }}]
                  - key: role
                    operator: In
                    values: ["wdb"]
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: "{{ $.Values.global.imageRegistry }}kdb-control-plane/data-plane:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- if eq $svc.role "tickerplant" }}
          command: ["q", "tick.q", "{{ $svc.shard }}", "-p", "{{ $svc.port | toString }}"]
          {{- else if eq $svc.role "wdb" }}
          command: ["q", "wdb.q", "-shard", "{{ $svc.shard }}", "-tphost", "{{ $svc.tpHost }}",
                    "-tpport", "{{ $svc.tpPort | toString }}", "-flushmin", "{{ $.Values.dataPlane.flushMinutes | toString }}",
                    "-dbdir", "/data/db", "-p", "{{ $svc.port | toString }}"]
          {{- else if eq $svc.role "rdb" }}
          command: ["q", "rdb.q", "-shard", "{{ $svc.shard }}", "-tphost", "{{ $svc.tpHost }}",
                    "-tpport", "{{ $svc.tpPort | toString }}", "-p", "{{ $svc.port | toString }}"]
          {{- else if eq $svc.role "idb" }}
          command: ["q", "idb.q", "-shard", "{{ $svc.shard }}", "-dbdir", "/data/db",
                    "-pollsec", "{{ $.Values.dataPlane.idbPollSeconds | toString }}", "-p", "{{ $svc.port | toString }}"]
          {{- else if eq $svc.role "gateway" }}
          command: ["q", "gateway.q", "-p", "{{ $svc.port | toString }}"]
          {{- end }}
          ports:
            - containerPort: {{ $svc.port }}
          volumeMounts:
            {{- if $svc.volumes.db }}
            - name: db
              mountPath: /data/db
            {{- end }}
            {{- if $svc.volumes.tpLog }}
            - name: tp-log
              mountPath: /app/log
            {{- end }}
            - name: kdbx-license
              mountPath: /usr/local/kdbx/q
              subPath: q
            - name: kdbx-license
              mountPath: /usr/local/kdbx/k4.lic
              subPath: k4.lic
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { memory: "1Gi" }
      volumes:
        {{- if $svc.volumes.db }}
        - name: db
          persistentVolumeClaim: { claimName: {{ $svc.volumes.db }} }
        {{- end }}
        {{- if $svc.volumes.tpLog }}
        - name: tp-log
          persistentVolumeClaim: { claimName: {{ $svc.volumes.tpLog }} }
        {{- end }}
        - name: kdbx-license
          secret: { secretName: {{ $.Values.kdbx.licenseSecretName }}, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  namespace: {{ $.Values.global.namespace }}
spec:
  selector: { app: {{ $svc.name }} }
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
