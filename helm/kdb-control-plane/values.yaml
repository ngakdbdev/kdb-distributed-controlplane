# Default values for the kdb-control-plane chart. Override per-environment
# with -f values-<env>.yaml or --set, e.g.:
#   helm install demo . -f values-aws.yaml --set secrets.jwtSecret=$(openssl rand -hex 32)

global:
  namespace: kdb-control-plane
  imageRegistry: ""            # e.g. "123456789.dkr.ecr.us-east-1.amazonaws.com/" - trailing slash, blank for local/dev
  imageTag: "0.2.0"
  imagePullPolicy: IfNotPresent
  storageClassName: ""         # blank = cluster default ("gp3" on EKS, "managed-csi" on AKS, "standard-rwo" on GKE, "local-path" on k3s)

# ==================================================================== SHARD TOPOLOGY
# Shard count is the single scaling dimension - the product's USP. Every
# per-shard q process (tickerplant/wdb/rdb/idb/hdb), its PVCs, the gateway's
# routing table (rendered into a ConfigMap from templates/_helpers.tpl), the
# feed fan-out, and the set of services the watchdog heals are ALL derived
# from this one number. There is no hand-maintained per-shard list anymore:
# set shardCount, run `helm upgrade`, and the data plane scales to N shards.
#
# Range 1-26 (the symbol space is partitioned into N contiguous first-letter
# ranges - A-M/N-Z at 2, A-G/H-N/O-T/U-Z at 4, and so on). Beyond 26 you'd
# switch to hash routing, which is out of scope for this chart.
shardCount: 2

# ---------------------------------------------------------------- secrets
# NEVER commit real values here. Override at install time:
#   --set secrets.jwtSecret=... --set secrets.watchdogSharedSecret=... --set secrets.adminPasswordHash=...
# or point secrets.existingSecret at a Secret you created out-of-band (recommended
# for anything beyond a local demo - see templates/secrets.yaml).
secrets:
  existingSecret: ""           # if set, the values below are ignored and this Secret name is used directly
  adminUser: admin
  adminPasswordHash: ""        # bcrypt hash - blank falls back to the chart's dev default (password: changeme)
  jwtSecret: "dev-secret-change-in-deploy"
  watchdogSharedSecret: "dev-watchdog-secret-change-in-deploy"
  nl2qLlmApiKey: ""            # API key for whichever nl2q.llmProvider is set below; blank is fine for "none" or a keyless local model server

# ------------------------------------------------------ natural-language-to-q
# The query workspace's plain-English box. "none" (default) uses the
# frontend's offline regex generator only - no model, no key needed.
# "anthropic" and "openai_compatible" ground it in a real model instead -
# see control-api/app/nl2q.py. llmBaseUrl is how you point this at a
# self-hosted model server (Ollama, vLLM, LM Studio) for an on-prem/
# air-gapped cluster with no path to a public API.
nl2q:
  llmProvider: none
  llmModel: claude-opus-5
  llmBaseUrl: ""

# ------------------------------------------------------------- kdb-x license
# KDB-X binary + license are NOT bundled in the image for licensing reasons -
# mount them from a Secret you create yourself:
#   kubectl create secret generic kdbx-license -n kdb-control-plane \
#     --from-file=q=./q --from-file=k4.lic=./k4.lic
kdbx:
  licenseSecretName: kdbx-license

# --------------------------------------------------------------- database
# See control-api/README-database.md for dialect-specific connection string
# formats (postgres/mysql/mssql). SQLite (the default) is fine for a demo but
# CANNOT back more than one control-api replica (no concurrent-writer safety) -
# the chart hard-fails if you enable control-api autoscaling on a sqlite URL.
database:
  url: "sqlite:///./data/control_plane.db"

# --------------------------------------------------------- data-plane sizing
dataPlane:
  flushMinutes: 2
  idbPollSeconds: 15
  dbVolumeSize: 20Gi
  hdbVolumeSize: 100Gi   # cumulative historical storage - grows every trading day
  tpLogVolumeSize: 5Gi
  # per-shard pod resource requests/limits (each shard runs 5 q processes)
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { memory: "1Gi" }

# ------------------------------------------------------ end-of-day lifecycle
# hourUtc: which UTC hour the trading day rolls over at (0 = midnight UTC;
# set it to an exchange's close hour instead). The tickerplant self-triggers
# on this - no external cron dependency. retentionDays: how long idb keeps a
# sealed day in memory after wdb has written it into the hdb before evicting
# it. Per-TickHouse via control-api; these are the chart-level defaults.
eod:
  hourUtc: 0
idb:
  retentionDays: 5

feeds:
  bpipeRateHz: 20
  crimsRateHz: 2
  startEnabled: false

controlApi:
  image: kdb-control-plane/control-api
  replicas: 1
  port: 8000
  # Horizontal Pod Autoscaler for the stateless control API. The kdb data
  # plane does NOT autoscale on replicas - it scales on shardCount (stateful,
  # sharded) - so this HPA covers only the API tier. Requires a real
  # (non-sqlite) database.url; the chart fails the install otherwise.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

watchdog:
  image: kdb-control-plane/watchdog
  replicas: 1
  pollSeconds: 5

webUi:
  image: kdb-control-plane/web-ui
  replicas: 1
  port: 80

ingress:
  enabled: false
  className: ""                # "alb" on EKS, "azure-application-gateway" on AKS, "gce" on GKE, "nginx" on-prem
  host: ""                      # e.g. demo.yourcompany.com
  tls: false
